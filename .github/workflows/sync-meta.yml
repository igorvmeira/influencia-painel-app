name: sync-meta

on:
  schedule:
    # Todos os dias às 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Rodar sync-meta incremental
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          # ⚠️ O SEGREDO VAI NO CABEÇALHO, NUNCA NA URL — e isto não é preferência.
          # Query string é registrada em log por todo mundo no caminho: o Next
          # imprime a URL inteira no console do servidor, e proxy, CDN e histórico
          # de navegador fazem o mesmo. Foi exatamente assim que o CRON_SECRET deste
          # projeto apareceu num log em 16/08/2026.
          # O `lib/cronAuth.ts` aceita as duas formas; `?key=` continua existindo só
          # para chamada manual no navegador. Automação usa o cabeçalho.
          BASE="https://influencia-painel-app.vercel.app/api/sync-meta"
          LIMITE=10
          MAX_ITER=50
          OFFSET=0

          for i in $(seq 1 "$MAX_ITER"); do
            echo "== Iteração $i (offset=$OFFSET) =="

            RESP=$(curl -sS -H "Authorization: Bearer ${CRON_SECRET}" "${BASE}?offset=${OFFSET}&limite=${LIMITE}")

            PROCESSADAS=$(echo "$RESP" | jq -r '.processadas // 0')
            REGISTROS=$(echo "$RESP" | jq -r '.registros // 0')
            PROXIMO=$(echo "$RESP" | jq -r '.proximoOffset')
            OK=$(echo "$RESP" | jq -r '.ok // false')

            if [ "$OK" != "true" ]; then
              echo "Resposta sem ok=true; abortando."
              # Reimprime a resposta sem a chave (que só vai na URL, não no corpo).
              echo "$RESP" | jq '.'
              exit 1
            fi

            echo "Contas processadas nesta chamada: ${PROCESSADAS} (registros gravados: ${REGISTROS})"

            # ⚠️ IDENTIDADE: soma dos conjuntos = total da conta, dia a dia. As duas
            # fontes sao requisicoes INDEPENDENTES a Meta (level=account e level=adset)
            # sobre a mesma janela, entao a soma fecha em qualquer dia — para sempre.
            # Se quebrar e bug (apelido contado duas vezes, paginacao truncada), nao
            # deriva sozinha com o tempo. Por isso DERRUBA O JOB.
            IDENT=$(echo "$RESP" | jq -r '.conferencia.identidadeOk // "ausente"')
            if [ "$IDENT" = "false" ]; then
              echo "::error::A identidade conjunto vs conta QUEBROU — a quebra por conjunto nao fecha com o total. Nao troque a leitura."
              echo "$RESP" | jq '.conferencia'
              exit 1
            fi
            if [ "$IDENT" = "true" ]; then
              echo "Identidade OK em $(echo "$RESP" | jq -r '.conferencia.diasConferidos') dia-conta."
            fi

            # Falha de rede na quebra por conjunto NAO e divergencia: nao houve o que
            # comparar, e a linha conta-dia (que alimenta o app) ja foi gravada. Avisa.
            FALHAS=$(echo "$RESP" | jq -r '.conferencia.falhasNaQuebra | length')
            if [ "${FALHAS:-0}" != "0" ]; then
              echo "::warning::${FALHAS} conta(s) sem a quebra por conjunto nesta chamada (a metrica da conta foi gravada normalmente)."
              echo "$RESP" | jq -r '.conferencia.falhasNaQuebra[] | "  - \(.cliente): \(.erro)"'
            fi

            if [ "$PROXIMO" = "null" ] || [ -z "$PROXIMO" ]; then
              echo "proximoOffset=null — sincronização concluída."

              # DESCOBERTA DE CONTAS NOVAS — etapa secundária, roda no bloco final.
              # ⚠️ AVISA, NUNCA REPROVA O JOB. Métrica errada faz o painel mentir;
              # fila desatualizada só adia um cadastro que uma pessoa faria à mão.
              # Falhar o sync inteiro por causa dela treinaria a equipe a ignorar
              # o alerta vermelho — que é o que precisa continuar significando algo.
              DESC_OK=$(echo "$RESP" | jq -r '.descoberta.ok // "nao-rodou"')
              if [ "$DESC_OK" = "true" ]; then
                echo "Busca por contas novas: $(echo "$RESP" | jq -r '.descoberta.candidatas') candidata(s) na fila."
              elif [ "$DESC_OK" = "nao-rodou" ]; then
                echo "Busca por contas novas: não rodou nesta execução."
              else
                echo "::warning::A busca por contas novas falhou (o sync de métricas está OK): $(echo "$RESP" | jq -r '.descoberta.erro')"
              fi

              break
            fi

            OFFSET="$PROXIMO"
            sleep 2
          done
