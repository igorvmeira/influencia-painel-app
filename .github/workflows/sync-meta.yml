name: sync-meta

# ⚠️ QUEM DISPARA ISTO NO HORÁRIO É O CRON DA VERCEL (vercel.json → /api/cron/dispara/sync-meta,
# 09:00 UTC = 06:00 em Brasília), por workflow_dispatch. Decisão de 15/09/2026: o agendamento
# do GitHub atrasava de 0h29 a 11h46 (65 execuções medidas), e toda manhã a tela mostrava
# anteontem. A Vercel só dispara; a execução e a conferência do retorno continuam aqui.
#
# O `schedule` abaixo virou REDE DE SEGURANÇA: se o disparo das 06:00 não chegar (token
# expirado, GitHub fora), esta execução atrasada ainda roda o sync — e avisa que o disparo
# faltou. Se o disparo chegou, ela não roda de novo.

on:
  schedule:
    # 11:17 UTC = 08:17 em Brasília. Fora da virada da hora, que é onde o GitHub mais atrasa.
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      origem:
        description: "Quem disparou (vercel-cron quando é o cron; manual quando é uma pessoa)"
        required: false
        default: "manual"

# ⚠️ Nunca dois syncs ao mesmo tempo: o disparo da Vercel e a rede (ou um disparo manual) na
# mesma hora esperam um pelo outro em vez de gravar em paralelo.
concurrency:
  group: sync-meta
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Rede de segurança — o sync de hoje já foi disparado?
        id: rede
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          ORIGEM: ${{ inputs.origem }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${REPO}/actions"

          if [ "$EVENTO" != "schedule" ]; then
            # Disparo direto (Vercel ou pessoa): roda. E registra quanto o GitHub levou entre
            # ACEITAR o disparo e COMEÇAR esta execução — a medida que não existia quando a
            # opção foi escolhida (ver README, pendência de 15/09/2026).
            RUN=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}/runs/${RUN_ID}" || echo "{}")
            CRIADO=$(echo "$RUN" | jq -r '.created_at // empty')
            if [ -n "$CRIADO" ]; then
              FILA=$(( $(date -u +%s) - $(date -u -d "$CRIADO" +%s) ))
              ALVO=$(date -u -d "$(date -u -d "$CRIADO" +%F)T09:00:00Z" +%s)
              DEPOIS_DAS_9=$(( $(date -u -d "$CRIADO" +%s) - ALVO ))
              echo "::notice::Disparo (${ORIGEM:-sem origem}) aceito pelo GitHub em ${CRIADO}; esta execução começou ${FILA}s depois. Aceite ${DEPOIS_DAS_9}s após 09:00 UTC."
            fi
            echo "rodar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ⚠️ A REDE DECIDE PELO REGISTRO DAS EXECUÇÕES, NUNCA PELA HORA DO ÚLTIMO DADO. Um sync
          # que demorou aparece como "in_progress" aqui — pela hora (ou pelo sistema/sync.atualizadoEm,
          # que é gravado a cada bloco), ele pareceria não ter rodado e a rede dispararia outro.
          HOJE=$(TZ=America/Sao_Paulo date +%F)
          RESP=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${API}/workflows/sync-meta.yml/runs?event=workflow_dispatch&per_page=30" || echo "")
          if [ -z "$RESP" ] || ! echo "$RESP" | jq -e '.workflow_runs' > /dev/null 2>&1; then
            echo "::warning::A rede não conseguiu ler o registro das execuções — roda o sync por garantia (o sync é idempotente)."
            echo "rodar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Execuções disparadas HOJE (dia em Brasília, pelo instante em que o GitHub aceitou o disparo).
          DE_HOJE=$(echo "$RESP" | jq -c --arg hoje "$HOJE" \
            '[.workflow_runs[] | select((.created_at | fromdateiso8601 - 10800 | strftime("%Y-%m-%d")) == $hoje)]')
          QTD=$(echo "$DE_HOJE" | jq 'length')
          # Vale como "já rodou": em fila, em andamento ou concluída com sucesso.
          VALIDA=$(echo "$DE_HOJE" | jq -r \
            '[.[] | select(.status != "completed" or .conclusion == "success")] | first
             | if . then "execução \(.id) — \(.status)/\(.conclusion // "em curso"), aceita às \(.created_at | fromdateiso8601 - 10800 | strftime("%H:%M")) de Brasília" else "" end')

          if [ -n "$VALIDA" ]; then
            echo "::notice::O sync de hoje já foi disparado (${VALIDA}). A rede não roda de novo."
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          elif [ "$QTD" != "0" ]; then
            echo "::warning::Houve ${QTD} disparo(s) hoje e nenhum terminou com sucesso — a rede roda o sync de novo."
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::O disparo das 06:00 NÃO CHEGOU: nenhuma execução por workflow_dispatch hoje. Conferir sistema/disparoWorkflows no Firestore e o GITHUB_DISPATCH_TOKEN na Vercel. A rede roda o sync agora."
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rodar sync-meta incremental
        if: steps.rede.outputs.rodar == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          # ⚠️ O SEGREDO VAI NO CABEÇALHO, NUNCA NA URL — e isto não é preferência.
          # Query string é registrada em log por todo mundo no caminho: o Next
          # imprime a URL inteira no console do servidor, e proxy, CDN e histórico
          # de navegador fazem o mesmo. Foi exatamente assim que o CRON_SECRET deste
          # projeto apareceu num log em 16/08/2026.
          # O `lib/cronAuth.ts` aceita as duas formas; `?key=` continua existindo só
          # para chamada manual no navegador. Automação usa o cabeçalho.
          BASE="https://influencia-painel-app.vercel.app/api/sync-meta"
          LIMITE=10
          MAX_ITER=50
          OFFSET=0
          PROXIMO=""
          # O início da execução vai em toda chamada: o bloco final usa para contar, pelo
          # registro de cada conta, quantas ativas NÃO gravaram nesta execução (falha em massa).
          INICIO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ESPERADAS="${RUNNER_TEMP}/falhas-esperadas.txt"
          : > "$ESPERADAS"
          BLOQUEANTES=0

          for i in $(seq 1 "$MAX_ITER"); do
            echo "== Iteração $i (offset=$OFFSET) =="

            RESP=$(curl -sS -H "Authorization: Bearer ${CRON_SECRET}" "${BASE}?offset=${OFFSET}&limite=${LIMITE}&inicio=${INICIO}")

            PROCESSADAS=$(echo "$RESP" | jq -r '.processadas // 0')
            REGISTROS=$(echo "$RESP" | jq -r '.registros // 0')
            PROXIMO=$(echo "$RESP" | jq -r '.proximoOffset')
            OK=$(echo "$RESP" | jq -r '.ok // false')

            if [ "$OK" != "true" ]; then
              echo "Resposta sem ok=true; abortando."
              # Reimprime a resposta sem a chave (que só vai na URL, não no corpo).
              echo "$RESP" | jq '.'
              exit 1
            fi

            echo "Contas processadas nesta chamada: ${PROCESSADAS} (registros gravados: ${REGISTROS})"

            # ⚠️ IDENTIDADE: soma dos conjuntos = total da conta, dia a dia. As duas
            # fontes sao requisicoes INDEPENDENTES a Meta (level=account e level=adset)
            # sobre a mesma janela, entao a soma fecha em qualquer dia — para sempre.
            # Se quebrar e bug (apelido contado duas vezes, paginacao truncada), nao
            # deriva sozinha com o tempo. Por isso DERRUBA O JOB.
            IDENT=$(echo "$RESP" | jq -r '.conferencia.identidadeOk // "ausente"')
            if [ "$IDENT" = "false" ]; then
              echo "::error::A identidade conjunto vs conta QUEBROU — a quebra por conjunto nao fecha com o total. Nao troque a leitura."
              echo "$RESP" | jq '.conferencia'
              exit 1
            fi
            if [ "$IDENT" = "true" ]; then
              echo "Identidade OK em $(echo "$RESP" | jq -r '.conferencia.diasConferidos') dia-conta."
            fi

            # ⚠️ AS FALHAS DE CONTA VÊM CLASSIFICADAS PELA ROTA (lib/falhasSync.ts), e é o veredito
            # que decide a cor. Até 15/09/2026 toda falha de conta só AVISAVA "porque o próximo sync
            # refaz" — e a ISP4 ficou 12 dias sem dado com o job verde, porque erro de permissão não
            # se refaz. As regras: pausada = esperada (nunca derruba); ativa com permissão negada =
            # derruba; passageira = avisa até a conta passar de 36 h sem gravar; em massa = derruba.
            # O bloqueante NÃO interrompe a varredura: as outras contas precisam ser gravadas. O
            # job só fica vermelho no fim.
            if ! echo "$RESP" | jq -e '.classificacao' > /dev/null 2>&1; then
              echo "::error::A resposta não trouxe a classificação das falhas — sem ela o job não sabe se alguma conta ativa ficou sem gravar."
              exit 1
            fi
            N_BLOQ=$(echo "$RESP" | jq -r '.classificacao.bloqueantes | length')
            BLOQUEANTES=$(( BLOQUEANTES + N_BLOQ ))
            echo "$RESP" | jq -r '.classificacao.bloqueantes[] | "::error::\(.cliente) (\(.accountId)) — \(.motivo)"'
            echo "$RESP" | jq -r '.classificacao.toleradas[] | "::warning::\(.cliente) (\(.accountId)) — \(.motivo)"'
            echo "$RESP" | jq -r '.classificacao.cientes[] | "::warning::\(.cliente) (\(.accountId)) — \(.motivo)"'
            echo "$RESP" | jq -r '.classificacao.marcasObsoletas[] | "::notice::\(.cliente) (\(.accountId)) voltou a gravar — a marca de ciente dela pode ser removida (scripts/marcar-falha-ciente.js --remover)."'
            echo "$RESP" | jq -r '.classificacao.esperadas[] | "  - \(.cliente) (\(.accountId)): \(.motivo)"' >> "$ESPERADAS"

            # Falha de rede na quebra por conjunto NAO e divergencia: nao houve o que
            # comparar, e a linha conta-dia (que alimenta o app) ja foi gravada. Avisa.
            FALHAS=$(echo "$RESP" | jq -r '.conferencia.falhasNaQuebra | length')
            if [ "${FALHAS:-0}" != "0" ]; then
              echo "::warning::${FALHAS} conta(s) sem a quebra por conjunto nesta chamada (a metrica da conta foi gravada normalmente)."
              echo "$RESP" | jq -r '.conferencia.falhasNaQuebra[] | "  - \(.cliente): \(.erro)"'
            fi

            if [ "$PROXIMO" = "null" ] || [ -z "$PROXIMO" ]; then
              echo "proximoOffset=null — sincronização concluída."

              # DESCOBERTA DE CONTAS NOVAS — etapa secundária, roda no bloco final.
              # ⚠️ AVISA, NUNCA REPROVA O JOB. Métrica errada faz o painel mentir;
              # fila desatualizada só adia um cadastro que uma pessoa faria à mão.
              # Falhar o sync inteiro por causa dela treinaria a equipe a ignorar
              # o alerta vermelho — que é o que precisa continuar significando algo.
              DESC_OK=$(echo "$RESP" | jq -r '.descoberta.ok // "nao-rodou"')
              if [ "$DESC_OK" = "true" ]; then
                echo "Busca por contas novas: $(echo "$RESP" | jq -r '.descoberta.candidatas') candidata(s) na fila."
              elif [ "$DESC_OK" = "nao-rodou" ]; then
                echo "Busca por contas novas: não rodou nesta execução."
              else
                echo "::warning::A busca por contas novas falhou (o sync de métricas está OK): $(echo "$RESP" | jq -r '.descoberta.erro')"
              fi

              break
            fi

            OFFSET="$PROXIMO"
            sleep 2
          done

          # ---- A COR DO JOB, decidida só depois de a varredura inteira gravar o que conseguiu ----
          if [ "$PROXIMO" != "null" ] && [ -n "$PROXIMO" ]; then
            echo "::error::A varredura parou em ${MAX_ITER} iterações sem terminar (próximo offset ${PROXIMO})."
            exit 1
          fi

          # Regra 1: pausada sem leitura é esperada — um aviso só, no fim, e nunca vermelho.
          if [ -s "$ESPERADAS" ]; then
            echo "Falhas esperadas (contas pausadas — não derrubam o job):"
            cat "$ESPERADAS"
            echo "::notice::$(wc -l < "$ESPERADAS") conta(s) pausada(s) sem leitura na Meta — fora dos números; sem leitura não dá para saber se voltaram a veicular."
          fi

          # Regra 4: falha em massa, pelo registro de gravação de cada conta (bloco final).
          MASSA=$(echo "$RESP" | jq -r '.fechamento.massa // "ausente"')
          if [ "$MASSA" = "ausente" ]; then
            echo "::error::O fechamento da execução não veio no bloco final — sem ele o job não sabe se houve falha em massa."
            exit 1
          fi
          echo "Fechamento: $(echo "$RESP" | jq -r '.fechamento | "\(.naoGravadas) de \(.ativasComDoc) contas ativas sem gravar nesta execução (corte de massa: \(.corteContas))"')"
          if [ "$MASSA" = "true" ]; then
            echo "::error::FALHA EM MASSA — $(echo "$RESP" | jq -r '.fechamento | "\(.naoGravadas) de \(.ativasComDoc) contas ativas não gravaram (corte: \(.corteContas)). Primeiras: \(.contas | join(", "))"'). Token da Meta vencido? Meta fora do ar?"
            exit 1
          fi

          # Regras 2 e 3: conta ativa sem gravar por falha que não se resolve sozinha.
          if [ "$BLOQUEANTES" -gt 0 ]; then
            echo "::error::${BLOQUEANTES} conta(s) ativa(s) sem gravar por falha que não se resolve sozinha — ver os erros acima. As outras contas foram gravadas normalmente."
            exit 1
          fi
